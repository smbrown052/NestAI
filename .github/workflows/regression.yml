name: MVP regression
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nestai_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: nestai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nestai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      NESTAI_TEST_DATABASE_URL: postgresql+psycopg2://nestai_test@127.0.0.1:5432/nestai_test
      TEST_POSTGRES_URL: postgresql+psycopg2://nestai_test@127.0.0.1:5432/nestai_test
      NESTAI_BROWSER_DATABASE_URL: postgresql+psycopg2://nestai_test@127.0.0.1:5432/nestai_browser
      DATABASE_URL: postgresql+psycopg2://nestai_test@127.0.0.1:5432/nestai_test
      PGPASSWORD: isolated-ci-only
      JWT_SECRET_KEY: isolated-ci-signing-value-not-production
      NESTAI_DISABLE_EMAIL: "true"
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r legacy/streamlit/requirements.txt -r services/api/requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: make regression
